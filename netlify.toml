# Monorepo: Next app in rahat-project/frontend
# - Do NOT set `publish` (not .next, not public). The Next plugin sets deploy output.
# - Netlify UI: Base directory empty OR rahat-project/frontend; Publish directory MUST be empty.
[build]
  base = "rahat-project/frontend"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_PRODUCTION = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
