version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rahat-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: rahat_db
    ports:
      - "5432:5432"
    volumes:
      - rahat-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rahat-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  rahat-pg-data:
